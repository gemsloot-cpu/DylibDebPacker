name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project DylibDebPacker.xcodeproj \
            -scheme DylibDebPacker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/DylibDebPacker.app"
          test -d "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry DylibDebPacker.ipa Payload)
          ls -lh build/DylibDebPacker.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DylibDebPacker-ipa
          path: build/DylibDebPacker.ipa
          if-no-files-found: error
