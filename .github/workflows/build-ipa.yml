name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project DylibDebPacker.xcodeproj \
            -scheme DylibDebPacker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/DylibDebPacker.app"
          test -d "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry DylibDebPacker.ipa Payload)
          ls -lh build/DylibDebPacker.ipa

      - name: Get commit info
        id: commit
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: DylibDebPacker-${{ steps.commit.outputs.sha_short }}
          path: build/DylibDebPacker.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Delete old latest release
        run: |
          gh release delete latest --yes 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create/Update latest release
        uses: softprops/action-gh-release@v2
        with:
          files: build/DylibDebPacker.ipa
          tag_name: latest
          name: Latest Build
          body: |
            **Latest Build**
            
            **Commit:** ${{ steps.commit.outputs.sha_short }}
            **Message:** ${{ steps.commit.outputs.message }}
            **Built:** ${{ steps.commit.outputs.timestamp }}
            
            Download the IPA and sign it with your device using TrollStore or similar tools.
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
